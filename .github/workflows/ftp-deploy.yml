name: FTP Deploy

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Kodı indir
        uses: actions/checkout@v4

      - name: PHP kur
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Composer bağımlılıkları
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction

      - name: Frontend build
        run: |
          npm install
          npm run build

      - name: FTP ile yükle
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ftp.gonulkoprusu.com
          username: web@gonulkoprusu.com
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /
          exclude: |
            **/.git/**
            **/.gitignore
            **/node_modules/**
            **/vendor/**
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/bootstrap/cache/**
            **/.env
            **/.env.example
            **/.env.production
            **/deploy_ftp.*
            **/deploy.sh
            **/gonulkop-deploy.zip
            **/public_html/
            **/.github/**
