- name: FTP ile yükle
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.gonulkoprusu.com
          username: gonulweb@gonulkoprusu.com
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /public_html/
          protocol: ftp
          state-name: ftp-deploy-state.json
          exclude: |
            **/.git/**
            **/.env
            **/.env.example
            **/.env.production
            **/node_modules/**
            **/storage/*.sqlite
            **/storage/logs/*
            **/storage/framework/cache/data/*
            **/storage/framework/sessions/*
            **/storage/framework/views/*
            **/deploy_ftp.*
            **/deploy.sh
            **/gonulkop-deploy.zip
            **/.github/**
            **/tests/**
            **/phpunit.xml
            **/README.md

      - name: Web Sitesi Cache Temizleme Tetikle
        run: |
          curl -s "https://gonulkoprusu.com/deploy-cache-clear-start"