name: FTP Deploy (Gönül Köprüsü)

# Windows klasör → git push → bu workflow → FTP → sunucu
on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ftp-deploy-gonulkop
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: PHP 8.3 kur
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, tokenizer, bcmath, fileinfo, pdo_mysql
          coverage: none

      - name: Node.js 22 kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Composer (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Frontend build
        run: |
          npm ci || npm install
          npm run build

      - name: Laravel optimize (config cache yok — .env sunucuda kalır)
        run: |
          php artisan package:discover --ansi || true

      - name: FTP ile public_html'e yükle
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/public_html/' }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.env
            **/.env.*
            **/.env.example
            **/node_modules/**
            **/tests/**
            **/phpunit.xml
            **/.phpunit.result.cache
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/storage/*.sqlite
            **/database/*.sqlite
            **/Screenshots/**
            **/__pycache__/**
            **/auto_ftp_deploy.py
            **/.mcp.json
            **/Dockerfile
            **/docker-compose.yml
            **/README.md
            **/DEPLOY*.md
            **/.editorconfig
            **/.npmrc
