<!DOCTYPE html>
<html lang="tr" class="scroll-smooth">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gönül Köprüsü | Aradığınız Doğru Kişiyle Burada Tanışın</title>
<meta name="description" content="Gönül Köprüsü: şehir ve ülke rehberleriyle doğrulanmış profilleri keşfedin. Güvenli, modern ve romantik evlilik tanışma platformu." />
<meta name="theme-color" content="#C2185B" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />

<!-- Tailwind CSS (tek dosya prensibi: CDN) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        brand: { 50:'#FFF1F6', 100:'#FFE3EE', 200:'#FFC7DD', 300:'#FF9DC2', 400:'#FF6FA3', 500:'#F03A7E', 600:'#C2185B', 700:'#A0144D', 800:'#7F103E', 900:'#5C0C2D' },
        navy:  { 50:'#EEF0FB', 100:'#DDE1F7', 200:'#B9C0EF', 300:'#8C97DF', 400:'#5D6BCB', 500:'#3949AB', 600:'#303F9F', 700:'#1A237E', 800:'#151C63', 900:'#0A0E2E' },
        gold:  { 100:'#FFF6D6', 200:'#FFE9A3', 300:'#FFDD70', 400:'#FFD54F', 500:'#E5A93C', 600:'#C98A26' },
        cream: '#FAFAFA'
      },
      fontFamily: {
        display: ['"Playfair Display"', 'Georgia', 'serif'],
        sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'sans-serif']
      },
      boxShadow: {
        soft: '0 18px 50px -24px rgba(26,35,126,.35)',
        glow: '0 12px 34px -10px rgba(255,64,129,.55)'
      }
    }
  }
}
</script>

<style>
  :root{
    --gk-brand:#C2185B;
    --gk-brand-soft:#FF4081;
    --gk-navy:#1A237E;
    --gk-gold:#FFD54F;
    --gk-rose-gold:#E5A93C;
    --gk-cream:#FAFAFA;
    --gk-ink:#1B1733;
  }
  html{ -webkit-text-size-adjust:100%; }
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--gk-cream);
    color:var(--gk-ink);
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .font-display{ font-family:'Playfair Display',Georgia,serif; }
  ::selection{ background:rgba(194,24,91,.18); }

  /* ---------- Gradient metin ---------- */
  .gk-gradient-text{
    background:linear-gradient(100deg,#C2185B 0%,#FF4081 42%,#E5A93C 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }

  /* ---------- Gradient + Glow butonlar ---------- */
  .gk-btn{
    position:relative; display:inline-flex; align-items:center; justify-content:center; gap:.5rem;
    border-radius:9999px; font-weight:600; line-height:1; cursor:pointer; border:0;
    padding:.95rem 1.75rem; color:#fff; isolation:isolate;
    background:linear-gradient(135deg,#FF4081 0%,#FF6E40 100%);
    box-shadow:0 10px 30px -8px rgba(255,64,129,.55), inset 0 1px 0 rgba(255,255,255,.25);
    transition:transform .3s cubic-bezier(.16,1,.3,1), box-shadow .3s ease;
  }
  .gk-btn::before{
    content:''; position:absolute; inset:-3px; border-radius:inherit; z-index:-1;
    background:linear-gradient(135deg,#FF4081,#FF6E40);
    filter:blur(14px); opacity:0; transition:opacity .35s ease;
  }
  .gk-btn:hover{ transform:translateY(-3px) scale(1.03); box-shadow:0 16px 40px -10px rgba(255,64,129,.68), inset 0 1px 0 rgba(255,255,255,.3); }
  .gk-btn:hover::before{ opacity:.75; }
  .gk-btn:active{ transform:translateY(-1px) scale(1.01); }
  .gk-btn:focus-visible{ outline:3px solid rgba(255,213,79,.8); outline-offset:3px; }
  .gk-btn--ghost{
    background:rgba(255,255,255,.78); color:var(--gk-navy);
    border:1px solid rgba(26,35,126,.14);
    box-shadow:0 10px 26px -16px rgba(26,35,126,.45); backdrop-filter:blur(8px);
  }
  .gk-btn--ghost:hover{ color:var(--gk-brand); }
  .gk-btn--navy{ background:linear-gradient(135deg,#1A237E,#3949AB); box-shadow:0 10px 30px -10px rgba(26,35,126,.55); }
  .gk-btn--navy::before{ background:linear-gradient(135deg,#3949AB,#1A237E); }

  /* ---------- Kalp atışı animasyonu ---------- */
  .gk-pulse{ animation:gkHeartPulse 2s infinite ease-in-out; }
  @keyframes gkHeartPulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.08); } }
  .gk-heart-beat{ animation:gkHeartBeat 1.6s infinite ease-in-out; transform-origin:center; }
  @keyframes gkHeartBeat{ 0%,100%{transform:scale(1)} 14%{transform:scale(1.18)} 28%{transform:scale(1)} 42%{transform:scale(1.12)} 70%{transform:scale(1)} }
